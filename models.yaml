# Model registry for rhumb (renamed from eval-suite 2026-05-05).
#
# Each entry = one model under test. `endpoint` is an OpenAI-compatible base URL
# (override per-run with --endpoint; see endpoints.yaml). Per-task `baselines`
# drive the drift-check: a measured score whose |delta| from baseline exceeds the
# threshold (default 5pp) is flagged `drift: true` in the result JSON.

models:
  qwen3.6-35b-a3b-nvfp4:
    endpoint: http://umanks-mac-mini:30000/v1
    model_id: RedHatAI/Qwen3.6-35B-A3B-NVFP4
    api_key_env: VLLM_API_KEY
    tokenizer: RedHatAI/Qwen3.6-35B-A3B-NVFP4
    instruct: true
    disable_thinking: true            # quality MCQ/short-answer tasks; thinking blows up wall time
    fewshot_as_multiturn: false       # Qwen3.6 template strips <think> from fewshot turns
    tokenizer_backend: none           # route messages to server so chat_template_kwargs reaches the Jinja template
    notes: "RedHatAI NVFP4 of Qwen3.6-35B-A3B, served via SGLang TP=2 behind HAProxy at umanks-mac-mini:30000. DeepGemm warns scale_fmt!=ue8m0 so accuracy may run 1-3pp under the FP8 sibling."
    baselines:
      gsm8k: 0.90
      hellaswag: 0.88

  qwen3.6-35b-a3b-fp8:
    endpoint: http://umanks-mac-mini:30000/v1
    model_id: Qwen/Qwen3.6-35B-A3B-FP8
    api_key_env: VLLM_API_KEY
    tokenizer: Qwen/Qwen3.6-35B-A3B-FP8
    instruct: true
    disable_thinking: true
    fewshot_as_multiturn: false
    tokenizer_backend: none
    notes: "Official Qwen FP8 — reference for the NVFP4 drift-check. Same SGLang TP=2 endpoint (only one of NVFP4/FP8 served at a time); FP8 sibling has no NEXTN/MTP head."
    baselines:
      gsm8k: 0.90
      hellaswag: 0.88

  qwen3.6-27b-fp8:
    endpoint: http://umanks-mac-mini:30000/v1     # SGLang TP=2 (multimodal) behind HAProxy; same stack as the 35B siblings (--endpoint sglang-tp2 hits rank-0 directly)
    model_id: Qwen/Qwen3.6-27B-FP8
    api_key_env: VLLM_API_KEY
    tokenizer: Qwen/Qwen3.6-27B-FP8
    instruct: true
    vision: true                                  # gates the vlmeval runner; needs the multimodal SGLang endpoint
    fewshot_as_multiturn: false
    tokenizer_backend: none
    notes: "Official Qwen FP8. gsm8k baseline is measured thinking-on (n=200, measured 0.975, anchor 0.95). MMBench measured 2026-05-15 via SGLang TP=2 (NEXTN off), Kimi K2.6 judge."
    baselines:
      gsm8k: 0.95
      hellaswag: 0.88
      MMBench_DEV_EN_V11: 0.878

  qwen3.5-122b-a10b-fp8-tp2:
    endpoint: http://localhost:8765/v1            # default; override with --endpoint cluster-tp2
    model_id: Qwen/Qwen3.5-122B-A10B-FP8
    api_key_env: VLLM_API_KEY
    tokenizer: Qwen/Qwen3.5-122B-A10B-FP8
    instruct: true
    tokenizer_backend: none
    fewshot_as_multiturn: false
    notes: "122B-A10B MoE; requires the cluster (TP=2). Run with --endpoint cluster-tp2. Baselines are methodology-adjusted estimates (no on-hardware measurement yet)."
    baselines:
      gsm8k: 0.95
      hellaswag: 0.88

  medgemma-27b-fp8:
    endpoint: http://localhost:8000/v1
    model_id: ig1/medgemma-27b-it-FP8-Dynamic     # community FP8 quant; no official Google FP8
    api_key_env: VLLM_API_KEY
    tokenizer: ig1/medgemma-27b-it-FP8-Dynamic
    instruct: true
    max_length: 8192                              # match vLLM --max-model-len; bypass lm-eval's 2048 default that truncates long MCQ stems
    notes: |
      MedGemma 27B IT, community FP8 (no official Google FP8). For the medical_mcq suite.
      `_published_cot` baselines = MedGemma tech-report Table 3 (test-time scaling); reference
      only, NOT drift-checked. Bare task baselines = rhumb's measured single-pass loglikelihood
      (2026-05-07), expected 5-18pp below the TTS numbers as a methodology fingerprint.
    baselines:
      # published (test-time scaling, T=0.0) — reference only, NOT drift-checked
      medqa_4options_published_cot: 0.877
      medmcqa_published_cot: 0.742
      pubmedqa_published_cot: 0.768
      mmlu_anatomy_published_cot: 0.837
      mmlu_clinical_knowledge_published_cot: 0.860
      mmlu_college_biology_published_cot: 0.965
      mmlu_college_medicine_published_cot: 0.861
      mmlu_medical_genetics_published_cot: 0.970
      mmlu_professional_medicine_published_cot: 0.934
      medxpertqa_text_published_cot: 0.257
      afrimedqa_published_cot: 0.840          # informational; AfriMed-QA n=25 not in suite

      # measured-as-baseline (rhumb single-pass loglikelihood; 2026-05-07; pubmedqa
      # excluded — its bigbio loader needs trust_remote_code which we don't grant)
      medqa_4options: 0.697
      medmcqa: 0.563
      mmlu_anatomy: 0.667
      mmlu_clinical_knowledge: 0.785
      mmlu_college_biology: 0.833
      mmlu_college_medicine: 0.676
      mmlu_medical_genetics: 0.740
      mmlu_professional_medicine: 0.824
      medxpertqa_text: 0.181

  medgemma-1.5-4b-fp8:
    endpoint: http://localhost:8000/v1
    model_id: MedGemmaImpact/medgemma-1.5-4b-it-fp8
    api_key_env: VLLM_API_KEY
    tokenizer: MedGemmaImpact/medgemma-1.5-4b-it-fp8
    instruct: true
    max_length: 8192                              # match vLLM --max-model-len; bypass lm-eval's 2048 truncation
    notes: "MedGemma 1.5 4B IT FP8 — newer than the v1 4B in the tech report; no published per-task numbers, so all baselines are measured-as-baseline (populate after first run)."
    baselines: {}
