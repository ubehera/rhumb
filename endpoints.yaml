# Logical endpoint registry. Maps short names to vLLM (OpenAI-compatible)
# servers + auth config. Used by run.sh + runners when --endpoint <name>
# is passed. Without that flag, runs use each model's `endpoint:` field
# from models.yaml (current single-box behavior preserved).
#
# Schema per entry:
#   base_url:    OpenAI-compatible base; runners append /completions or
#                /chat/completions. Same shape as models.yaml's `endpoint:`.
#   api_key_env: name of the env var that holds the API key. After resolution
#                run.sh promotes its value into VLLM_API_KEY (where the
#                runners read it from).
#   env_file:    optional file to `set -a; source` before reading api_key_env.
#                ~ is expanded.
#   description: free-text label (informational only).
#
# Activating node-2 (no ConnectX-7 cable required for this — DP=2 mode):
#   1. On node-2: bring up vLLM (mirror ~/projects/vllm-server/serve.sh; use a
#      different VLLM_API_KEY in vllm.env — never share keys across boxes).
#   2. Confirm reachable from node-1: `curl -fsS http://<node-2-host>:8000/v1/models`
#      should return JSON with the served model id.
#   3. Below: replace `node-2.local` with node-2's actual hostname or IP.
#      mDNS-style `<host>.local` works if both boxes have Avahi; static
#      `/etc/hosts` is more reliable. NOT 127.0.0.1 — runners run on node-1.
#   4. Edit ~/.localbench/node-2.env (already templated, 0600) and replace
#      REPLACE_WITH_NODE_2_API_KEY with node-2's actual key.
#   5. Smoke test: ./run.sh --model qwen3.6-27b-awq --suite quick --endpoint node-2
#
# The ConnectX-7 cable (arrives 2026-05-07) is for TP=2 distributed inference
# — only needed for 70B+ models that can't fit in one box's 121 GiB. Today's
# medical_mcq + healthbench workloads run in DP=2 (independent serving on
# each box), which the configuration below already supports.

endpoints:
  local:
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY
    env_file: ~/projects/vllm-server/vllm.env
    description: "Default. Current single-box vLLM (also reachable as 'node-1')."

  node-1:
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY
    env_file: ~/projects/vllm-server/vllm.env
    description: "Primary GB10. Aliased to 'local' — both names exist so cross-box runs read symmetrically (e.g. `--endpoint node-1` vs `--endpoint node-2`)."

  node-2:
    # Wired interface (enP7s7); node-2 also has wifi at 192.168.4.33 but wired
    # is ~15x faster for rsync/curl. Both interfaces serve the vLLM API since
    # it binds 0.0.0.0:8000.
    base_url: http://192.168.4.29:8000/v1
    api_key_env: VLLM_API_KEY_NODE_2
    env_file: ~/.localbench/node-2.env
    description: "Second GB10 (edgexpert-7de5). Independent serving (DP=2)."

  trtllm:
    # TRT-LLM single-box deployment (NGC tensorrt-llm container, PyTorch backend).
    # Validated 2026-05-08 with nvidia/Qwen3-32B-NVFP4 at 10.9 tok/s
    # (--enforce-eager equivalent). Native NVFP4 GEMM via cutlass/cublaslt/cuda_core.
    # Distinct port (8866) from vLLM (8000 systemd, 8765 cluster), so both
    # stacks can run simultaneously when memory allows.
    # Bring up: see ~/projects/cluster-tools/trtllm-server.sh (or run docker
    # directly with the recipe in saga doc 2026-05-08).
    base_url: http://localhost:8866/v1
    api_key_env: VLLM_API_KEY_TRTLLM
    env_file: ~/.localbench/trtllm.env
    description: "TRT-LLM single-box (NGC container). For NVIDIA-blessed models with first-class sm_121 support."

  cluster-tp2:
    # Multi-node tensor-parallel deployment via Ray + 200G ConnectX-7 fabric.
    # Validated 2026-05-08 with Qwen3.5-122B-A10B-FP8 at 19.5 tok/s
    # (--enforce-eager). Served from node-1 (rank 0); rank 1 lives on node-2
    # transparently via Ray. Uses port 8765 (eugr image default), distinct
    # from the systemd-managed single-box vLLM on port 8000.
    #
    # Bring up:
    #   cd ~/projects/spark-vllm-docker
    #   ./launch-cluster.sh -n 10.99.99.1,10.99.99.2 \
    #     --launch-script qwen3.5-122b-fp8-tp2.sh -d
    # Tear down:
    #   ./launch-cluster.sh -n 10.99.99.1,10.99.99.2 stop
    #
    # API key currently empty (vLLM launch script does not pass --api-key).
    # See ~/.localbench/cluster-tp2.env for the rationale + hardening recipe.
    base_url: http://localhost:8765/v1
    api_key_env: VLLM_API_KEY_CLUSTER_TP2
    env_file: ~/.localbench/cluster-tp2.env
    description: "Cluster TP=2 (node-1 rank 0 + node-2 rank 1). For 100B+ models that don't fit one box."
